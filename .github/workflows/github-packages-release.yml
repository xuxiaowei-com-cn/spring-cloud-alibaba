name: GitHub Packages Release
on:
  push:
    branches:
      - 2023.x
      - 2025.0.x
      - xuxiaowei/*
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Dependencies Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: show maven env options
        run: |
          echo "MAVEN_OPTS=$MAVEN_OPTS"
          echo "MAVEN_CLI_OPTS=$MAVEN_CLI_OPTS"
      - name: show maven version
        run: mvn -v
      - name: install dependencies
        run: mvn clean -B install -U package -pl '!spring-cloud-alibaba-coverage'  -DskipTests
      - name: cat ~/.m2/settings.xml
        run: |
          echo "settings.xml before removing <interactiveMode>false</interactiveMode>:"
          cat ~/.m2/settings.xml
          sed -i "s#<interactiveMode>false</interactiveMode>##" ~/.m2/settings.xml
          echo "settings.xml after removing <interactiveMode>false</interactiveMode>:"
          cat ~/.m2/settings.xml
      - name: Deploy to GitHub Package Maven
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Project version: $VERSION"
          if [[ "$VERSION" != *"-SNAPSHOT" ]]; then
            echo "Not a snapshot version. Skipping deployment."
            exit 0
          fi
          mvn clean -B deploy -pl . -DskipTests
          cd $GITHUB_WORKSPACE/spring-cloud-alibaba-dependencies
          mvn clean -B deploy -DskipTests
          cd $GITHUB_WORKSPACE/spring-cloud-alibaba-starters
          mvn clean -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Delete snapshots from the Maven local repository
        run: find ~/.m2/repository -type d -name '*-SNAPSHOT' -print -exec rm -r {} +
